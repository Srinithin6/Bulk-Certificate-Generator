[project]
name = "bulk-certificate-api"
version = "2.0.0"
description = "Bulk PDF certificate generation API (FastAPI + SQLAlchemy)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in argument defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"app/services/pdf.py" = ["E702"]  # several short ReportLab drawing calls per line, on purpose
"tests/*" = ["E702", "SIM117"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
